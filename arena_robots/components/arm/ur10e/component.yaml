# UR10e arm component (phase3 sec2.10). Placement templating context adds `parent`
# (mount.parent, xacro-side only) beside the usual mount/prefix/params/overrides; caps
# rendering (effective_caps, item5) must supply it too once that lands.
xacro:
  include: "$(find ur_description)/urdf/ur_macro.xacro"
  macro: ur_robot
  attach:
    tf_prefix: "${prefix}${mount}_"
    name: ur10e
    parent: "${prefix}${parent}"
    joint_limits_parameters_file: "$(find ur_description)/config/ur10e/joint_limits.yaml"
    kinematics_parameters_file: "$(find ur_description)/config/ur10e/default_kinematics.yaml"
    physical_parameters_file: "$(find ur_description)/config/ur10e/physical_parameters.yaml"
    visual_parameters_file: "$(find ur_description)/config/ur10e/visual_parameters.yaml"
    sim_gazebo: "${gazebo_classic}"
    sim_ignition: "${gazebo_ignition}"
    safety_limits: "${safety_limits:-false}"
  args:
    safety_limits: false

ros2_control:
  joints:
    - name: "${prefix}${mount}_shoulder_pan_joint"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_shoulder_lift_joint"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_elbow_joint"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_wrist_1_joint"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_wrist_2_joint"
      command_interfaces: [position]
      state_interfaces: [position, velocity]
    - name: "${prefix}${mount}_wrist_3_joint"
      command_interfaces: [position]
      state_interfaces: [position, velocity]

# JTC params verbatim from robots/rbrobout_plus/control.yaml's arm_controller section
# (identical to rbvogui_plus/rbkairos_plus: variant-invariant controller tuning).
control:
  controller: "${mount}_controller"
  type: joint_trajectory_controller/JointTrajectoryController
  ros__parameters:
    joints:
      - "${prefix}${mount}_shoulder_pan_joint"
      - "${prefix}${mount}_shoulder_lift_joint"
      - "${prefix}${mount}_elbow_joint"
      - "${prefix}${mount}_wrist_1_joint"
      - "${prefix}${mount}_wrist_2_joint"
      - "${prefix}${mount}_wrist_3_joint"
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

# Full caps/arm.yaml shape (caps.py:381 ArmSpec), rendered per placement. named_poses
# values verbatim from robots/rbrobout_plus/caps/arm.yaml (fitsweep: variant-invariant);
# only joint/link names are mount-reprefixed (robot_arm_* -> ${prefix}${mount}_*).
# workspace.min/max are NOT copied from rbrobout_plus (fitsweep defect: that file byte-
# copied the ur5e box) -- see joint_limits.yaml / this workspace block for the fix.
caps:
  base_link: "${prefix}${parent}"
  tip_link: "${prefix}${mount}_tool0"
  chain:
    - "${prefix}${mount}_shoulder_pan_joint"
    - "${prefix}${mount}_shoulder_lift_joint"
    - "${prefix}${mount}_elbow_joint"
    - "${prefix}${mount}_wrist_1_joint"
    - "${prefix}${mount}_wrist_2_joint"
    - "${prefix}${mount}_wrist_3_joint"
  controller: "${mount}_controller"
  moveit:
    package: ur_moveit_config
    planning_group: "${mount}_manipulator"
    srdf:
      package: arena_robots
      path: components/arm/ur10e/srdf/ur10e.srdf.xacro
    joint_limits:
      package: arena_robots
      path: components/arm/ur10e/joint_limits.yaml
    args:
      ur_type: ur10e
      prefix: "${prefix}"
      safety_limits: true
      mount: "${mount}"
      parent: "${parent}"
  # ESTIMATE, needs owner sign-off: ur5e box scaled by reach ratio 1.3m/0.85m =~ 1.53
  # (UR10e vs UR5e max reach per Universal Robots spec sheets), rounded to 2dp. Replaces
  # the fitsweep-flagged defect (rbrobout_plus copied the ur5e box verbatim).
  workspace:
    type: box
    frame: "${prefix}${parent}"
    min: [0.3, -0.75, 0.3]
    max: [1.1, 0.75, 1.5]
  named_poses:
    stow:
      joints:
        "${prefix}${mount}_shoulder_pan_joint": 0.0
        "${prefix}${mount}_shoulder_lift_joint": -1.57
        "${prefix}${mount}_elbow_joint": 1.57
        "${prefix}${mount}_wrist_1_joint": -1.57
        "${prefix}${mount}_wrist_2_joint": -1.57
        "${prefix}${mount}_wrist_3_joint": 0.0
    ready:
      joints:
        "${prefix}${mount}_shoulder_pan_joint": 0.0
        "${prefix}${mount}_shoulder_lift_joint": -1.0
        "${prefix}${mount}_elbow_joint": 1.0
        "${prefix}${mount}_wrist_1_joint": -1.5
        "${prefix}${mount}_wrist_2_joint": -1.57
        "${prefix}${mount}_wrist_3_joint": 0.0
    wave_up:
      joints:
        "${prefix}${mount}_shoulder_pan_joint": 0.0
        "${prefix}${mount}_shoulder_lift_joint": -0.5
        "${prefix}${mount}_elbow_joint": 1.2
        "${prefix}${mount}_wrist_1_joint": -2.3
        "${prefix}${mount}_wrist_2_joint": -1.57
        "${prefix}${mount}_wrist_3_joint": 0.0
    wave_l:
      joints:
        "${prefix}${mount}_shoulder_pan_joint": 0.0
        "${prefix}${mount}_shoulder_lift_joint": -0.5
        "${prefix}${mount}_elbow_joint": 1.2
        "${prefix}${mount}_wrist_1_joint": -2.3
        "${prefix}${mount}_wrist_2_joint": -1.57
        "${prefix}${mount}_wrist_3_joint": -0.6
    wave_r:
      joints:
        "${prefix}${mount}_shoulder_pan_joint": 0.0
        "${prefix}${mount}_shoulder_lift_joint": -0.5
        "${prefix}${mount}_elbow_joint": 1.2
        "${prefix}${mount}_wrist_1_joint": -2.3
        "${prefix}${mount}_wrist_2_joint": -1.57
        "${prefix}${mount}_wrist_3_joint": 0.6
