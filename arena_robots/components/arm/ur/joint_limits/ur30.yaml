# MoveIt planning joint_limits for arm/ur variant ur30. max_velocity from
# ur_description config/ur30 (the URDF/controller limits); max_acceleration is
# the family's uniform planning cap (UR publishes no accel limits). Keys templated
# ${prefix}${mount}_*, re-keyed per placement by moveit_factory.py.
