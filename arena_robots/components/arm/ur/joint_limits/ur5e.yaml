# MoveIt planning joint_limits for arm/ur variant ur5e. max_velocity from
# ur_description config/ur5e (the URDF/controller limits); max_acceleration is
# the family's uniform planning cap (UR publishes no accel limits). Keys templated
# ${prefix}${mount}_*, re-keyed per placement by moveit_factory.py.
# wrist_* kept at 360deg/s (rbvogui_plus shipped value), not ur_description's 180.
joint_limits:
  "${prefix}${mount}_shoulder_pan_joint":
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 15.0
  "${prefix}${mount}_shoulder_lift_joint":
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 15.0
  "${prefix}${mount}_elbow_joint":
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 15.0
  "${prefix}${mount}_wrist_1_joint":
    has_velocity_limits: true
    max_velocity: 6.283185307179586
    has_acceleration_limits: true
    max_acceleration: 15.0
  "${prefix}${mount}_wrist_2_joint":
    has_velocity_limits: true
    max_velocity: 6.283185307179586
    has_acceleration_limits: true
    max_acceleration: 15.0
  "${prefix}${mount}_wrist_3_joint":
    has_velocity_limits: true
    max_velocity: 6.283185307179586
    has_acceleration_limits: true
    max_acceleration: 15.0
