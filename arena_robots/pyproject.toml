[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["deps", ".git", ".venv", "build", "install", "log"]
addopts = "-ra --strict-markers"
markers = [
    "ros: requires a sourced ROS2 environment",
    "slow: long-running tests",
]

[project.scripts]
acoustics_publisher = "arena_robots.acoustics_publisher:main"

