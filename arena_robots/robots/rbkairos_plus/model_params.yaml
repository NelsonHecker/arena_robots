robot_model: rbkairos_plus
base_frame: robot_base_footprint
z_offset: 0.37
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/lidar
    frame: lidar
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/lidar/points
    frame: lidar
  - name: lidar_rear
    type: laserscan
    topic: ${namespace}/lidar/rear
    frame: rear_laser
  - name: lidar_rear_points
    type: pointcloud
    topic: ${namespace}/lidar/rear/points
    frame: rear_laser
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: imu_sensor
  - name: rgbd_camera_image
    type: image
    topic: ${namespace}/rgbd_camera/image
    frame: front_camera_color
  - name: rgbd_camera_info
    type: camera_info
    topic: ${namespace}/rgbd_camera/camera_info
    frame: front_camera_color
control:
  mode: ros2_control
  config: package://arena_robots/robots/rbkairos_plus/control.yaml
  controllers:
    - joint_state_broadcaster
    - rbkairos_velocity_controller
    - arm_controller
  cmd_vel_topic: rbkairos_velocity_controller/reference
