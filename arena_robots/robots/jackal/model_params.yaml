robot_model: jackal
base_frame: base_link
z_offset: 0.0635
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/lidar
    frame: lidar
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/lidar/points
    frame: lidar
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: imu_sensor
control:
  mode: ros2_control
  config: package://arena_robots/robots/jackal/control.yaml
  controllers:
    - joint_state_broadcaster
    - jackal_velocity_controller
  cmd_vel_topic: jackal_velocity_controller/cmd_vel
  odom_topic: jackal_velocity_controller/odom
