mounts:
  front_laser:
    parent: base_link
    xyz: [0.2675, -0.215, 0.1613]
    rpy: [0, -3.141592653589793, 2.356194490192345]
    accepts: [lidar]
  rear_laser:
    parent: base_link
    xyz: [-0.2675, 0.215, 0.1613]
    rpy: [0, -3.141592653589793, -0.7853981633974483]
    accepts: [lidar]
  vectornav:
    parent: base_link
    xyz: [-0.1975, 0.0, 0.1598]
    rpy: [0, 0, 0]
    accepts: [imu]
  front_rgbd_camera:
    parent: base_link
    xyz: [0.3045, 0.0, 0.1898]
    rpy: [0, 0, 0]
    accepts: [camera]
  rear_rgbd_camera:
    parent: base_link
    xyz: [-0.3045, 0.0, 0.1158]
    rpy: [0, 0, 3.141592653589793]
    accepts: [camera]
defaults:
  lidar:
    - variant: hokuyo_ust20lx
      mount: front_laser
    - variant: hokuyo_ust20lx
      mount: rear_laser
      overrides: {name: lidar_rear, topic: scan/rear}
  imu:
    - variant: vectornav
      mount: vectornav
  camera:
    - variant: d435_color
      mount: front_rgbd_camera
      overrides: {name: front_camera, topic: front_camera}
    - variant: d435_color
      mount: rear_rgbd_camera
      overrides: {name: rear_camera, topic: rear_camera}
