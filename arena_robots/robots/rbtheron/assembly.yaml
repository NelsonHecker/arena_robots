mounts:
  front:
    parent: base_link
    xyz: [0.2675, -0.215, 0.1613]
    rpy: [0, -3.141592653589793, 2.356194490192345]
    accepts: [lidar]
    frame: front_laser
  rear:
    parent: base_link
    xyz: [-0.2675, 0.215, 0.1613]
    rpy: [0, -3.141592653589793, -0.7853981633974483]
    accepts: [lidar]
    frame: rear_laser
  imu:
    parent: base_link
    xyz: [-0.1975, 0.0, 0.1598]
    rpy: [0, 0, 0]
    accepts: [imu]
    frame: vectornav
  front_cam:
    parent: base_link
    xyz: [0.3045, 0.0, 0.1898]
    rpy: [0, 0, 0]
    accepts: [camera]
    frame: front_rgbd_camera
  rear_cam:
    parent: base_link
    xyz: [-0.3045, 0.0, 0.1158]
    rpy: [0, 0, 3.141592653589793]
    accepts: [camera]
    frame: rear_rgbd_camera
defaults:
  lidar:
    - variant: hokuyo_ust20lx
      mount: front
    - variant: hokuyo_ust20lx
      mount: rear
      overrides: {name: lidar_rear, topic: scan/rear}
  imu:
    - variant: vectornav
      mount: imu
  camera:
    - variant: d435_color
      mount: front_cam
      overrides: {name: front_camera, topic: front_camera}
    - variant: d435_color
      mount: rear_cam
      overrides: {name: rear_camera, topic: rear_camera}
