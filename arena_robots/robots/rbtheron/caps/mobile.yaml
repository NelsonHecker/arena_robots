odom_frame: odom
sensor_frame: robot_front_laser_link
radius: 0.35
is_holonomic: false

planar:
  velocity: {linear: [-1.0, 1.0], lateral: [0.0, 0.0], angular: [-1.0, 1.0]}
  acceleration: {linear: 5.0, lateral: .inf, angular: 5.0}
  gain: {linear: 1.0, lateral: 1.0, angular: 1.0}
  lag: 0.0
  traction: 9.81
  pivot: 0.0
  timeout: 0.25

actions:
  continuous:
    linear:
      min: -1.0
      max: 1.0
    angular:
      min: -1.0
      max: 1.0
  discrete:
  - {angular: 0.0, linear: 0.3, name: move_forward}
  - {angular: 0.0, linear: -0.15, name: move_backward}
  - {angular: 0.35, linear: 0.15, name: turn_left}
  - {angular: -0.35, linear: 0.15, name: turn_right}
  - {angular: 0.75, linear: 0.0, name: turn_strong_left}
  - {angular: -0.75, linear: 0.0, name: turn_strong_right}
  - {angular: 0.0, linear: 0.0, name: stop}

laser:
  angle:
    increment: 0.00436332313
    max: 2.35619449
    min: -2.35619449
  num_beams: 1081
  range: 20.0
  update_rate: 40
