- gz_topic: /model/{robot_name}/odometry
  ros_topic: odom
  ros_type: nav_msgs/msg/Odometry
  gz_type: gz.msgs.Odometry
  direction: '['
- gz_topic: '{world}/model/{robot_name}/link/robot_base_footprint/sensor/imu_sensor/imu'
  ros_topic: imu/data
  ros_type: sensor_msgs/msg/Imu
  gz_type: gz.msgs.IMU
  direction: '['
- gz_topic: '{world}/model/{robot_name}/link/robot_base_footprint/sensor/front_laser/scan'
  ros_topic: lidar
  ros_type: sensor_msgs/msg/LaserScan
  gz_type: gz.msgs.LaserScan
  direction: '['
- gz_topic: '{world}/model/{robot_name}/link/robot_base_footprint/sensor/front_laser/scan/points'
  ros_topic: lidar/points
  ros_type: sensor_msgs/msg/PointCloud2
  gz_type: gz.msgs.PointCloudPacked
  direction: '['
- gz_topic: '{world}/model/{robot_name}/link/robot_base_footprint/sensor/rear_laser/scan'
  ros_topic: lidar/rear
  ros_type: sensor_msgs/msg/LaserScan
  gz_type: gz.msgs.LaserScan
  direction: '['
- gz_topic: '{world}/model/{robot_name}/link/robot_base_footprint/sensor/rear_laser/scan/points'
  ros_topic: lidar/rear/points
  ros_type: sensor_msgs/msg/PointCloud2
  gz_type: gz.msgs.PointCloudPacked
  direction: '['
- gz_topic: /model/{robot_name}/pose
  ros_topic: pose
  ros_type: geometry_msgs/msg/PoseStamped
  gz_type: gz.msgs.Pose
  direction: '['
