controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rbrobout_velocity_controller:
      type: mecanum_drive_controller/MecanumDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    lift_controller:
      type: position_controllers/JointGroupPositionController

rbrobout_velocity_controller:
  ros__parameters:
    use_sim_time: true
    interface_name: velocity

    command_joint_names:
      - robot_front_left_wheel_joint
      - robot_back_left_wheel_joint
      - robot_back_right_wheel_joint
      - robot_front_right_wheel_joint
    front_left_wheel_command_joint_name: robot_front_left_wheel_joint
    front_right_wheel_command_joint_name: robot_front_right_wheel_joint
    rear_left_wheel_command_joint_name: robot_back_left_wheel_joint
    rear_right_wheel_command_joint_name: robot_back_right_wheel_joint

    kinematics.base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
    kinematics.wheels_radius: 0.127
    # half-wheelbase (0.558) + half-track (0.2865), per rbrobout_base.urdf.xacro
    kinematics.sum_of_robot_center_projection_on_X_Y_axis: 0.8445

    publish_rate: 50.0
    reference_timeout: 0.5
    use_stamped_vel: false

    base_frame_id: robot_base_footprint
    odom_frame_id: odom
    enable_odom_tf: false

    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 1000000.0, 1000000.0, 0.03]

    cmd_vel_timeout: 0.5

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 2.0
    linear.x.min_velocity: -2.0
    linear.x.max_acceleration: 20.0
    linear.x.min_acceleration: -20.0

    linear.y.has_velocity_limits: true
    linear.y.has_acceleration_limits: true
    linear.y.max_velocity: 2.0
    linear.y.min_velocity: -2.0
    linear.y.max_acceleration: 20.0
    linear.y.min_acceleration: -20.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 4.0
    angular.z.min_velocity: -4.0
    angular.z.max_acceleration: 25.0
    angular.z.min_acceleration: -25.0

arm_controller:
  ros__parameters:
    joints:
      - robot_arm_shoulder_pan_joint
      - robot_arm_shoulder_lift_joint
      - robot_arm_elbow_joint
      - robot_arm_wrist_1_joint
      - robot_arm_wrist_2_joint
      - robot_arm_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

lift_controller:
  ros__parameters:
    joints:
      - robot_lift_ewellix_lift_top_joint
