controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ridgeback_velocity_controller:
      type: diff_drive_controller/DiffDriveController

ridgeback_velocity_controller:
  ros__parameters:
    use_sim_time: true

    left_wheel_names: [front_left_wheel, rear_left_wheel]
    right_wheel_names: [front_right_wheel, rear_right_wheel]

    wheel_separation: 0.551
    wheel_radius: 0.0759

    # 4-wheel skid scrubs during rotation; 1.5 is empirical for ridgeback.
    wheel_separation_multiplier: 1.5

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 1000000.0, 1000000.0, 0.03]

    open_loop: false
    enable_odom_tf: false

    cmd_vel_timeout: 0.5
    use_stamped_vel: true

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 1.1
    linear.x.min_velocity: -1.1
    linear.x.max_acceleration: 2.0
    linear.x.min_acceleration: -2.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 2.0
    angular.z.min_acceleration: -2.0
