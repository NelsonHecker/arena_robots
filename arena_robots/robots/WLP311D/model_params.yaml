robot_model: WLP311D
base_frame: base
z_offset: 0.34
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/lidar
    frame: lidar
    sensor: gpu_lidar
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/lidar/points
    frame: lidar
    sensor: gpu_lidar
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: imu_link
    sensor: imu_sensor
control:
  mode: ros2_control
  config: package://arena_robots/robots/WLP311D/control.yaml
  controllers:
    - joint_state_broadcaster
    - wlp311d_velocity_controller
  cmd_vel_topic: wlp311d_velocity_controller/cmd_vel
