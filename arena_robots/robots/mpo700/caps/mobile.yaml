odom_frame: odom
sensor_frame: front_laser_link
radius: 0.45
is_holonomic: true

footprint: [[0.37, 0.255], [0.37, -0.255], [-0.37, -0.255], [-0.37, 0.255]]

polygons_dict:
  StopPolygon:
    type: polygon
    points: [[0.30, 0.20], [0.30, -0.20], [-0.30, -0.20], [-0.30, 0.20]]
    action_type: stop
    min_points: 3
    visualize: true
    polygon_pub_topic: polygon_stop
    enabled: true

actions:
  continuous:
    linear:
      min: -0.8
      max: 0.8
    angular:
      min: -1.0
      max: 1.0
  discrete:
    - {name: move_forward,  linear: 0.3,  angular: 0.0}
    - {name: move_backward, linear: -0.3, angular: 0.0}
    - {name: turn_left,     linear: 0.0,  angular: 0.5}
    - {name: turn_right,    linear: 0.0,  angular: -0.5}
    - {name: strafe_left,   linear: 0.0,  lateral: 0.3,  angular: 0.0}
    - {name: strafe_right,  linear: 0.0,  lateral: -0.3, angular: 0.0}
    - {name: stop,          linear: 0.0,  angular: 0.0}

laser:
  angle:
    min: -2.26892803
    max: 2.26892803
    increment: 0.00575
  num_beams: 270
  range: 10.0
  update_rate: 25

nav2:
  planner_plugins:
    - GridBased
  planner_plugins_dict:
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
