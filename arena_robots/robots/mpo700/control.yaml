controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mpo700_base_controller:
      type: arena_swerve_controller/SwerveController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    publish_rate: 50

mpo700_base_controller:
  ros__parameters:
    use_sim_time: true

    wheel_joint_names:
      - wheel_front_right_joint
      - wheel_front_left_joint
      - wheel_back_right_joint
      - wheel_back_left_joint
    steering_joint_names:
      - caster_front_right_joint
      - caster_front_left_joint
      - caster_back_right_joint
      - caster_back_left_joint

    wheel_radius: 0.09
    wheel_positions_x: [ 0.24,  0.24, -0.24, -0.24]
    wheel_positions_y: [-0.18,  0.18, -0.18,  0.18]

    max_steering_angle: 2.8
    allow_reverse_drive: true
    cmd_vel_timeout: 0.5
    use_stamped_vel: true

    publish_odom: true
    publish_tf: false
    odom_frame_id: odom
    base_frame_id: base_footprint
