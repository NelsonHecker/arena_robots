- gz_topic: '{world}/model/{robot_name}/link/base_footprint/sensor/front_laser/scan'
  ros_topic: scan
  ros_type: sensor_msgs/msg/LaserScan
  gz_type: gz.msgs.LaserScan
  direction: '['
- gz_topic: '{world}/model/{robot_name}/link/base_footprint/sensor/front_laser/scan/points'
  ros_topic: scan/points
  ros_type: sensor_msgs/msg/PointCloud2
  gz_type: gz.msgs.PointCloudPacked
  direction: '['
- gz_topic: '{world}/model/{robot_name}/link/base_footprint/sensor/rear_laser/scan'
  ros_topic: scan/rear
  ros_type: sensor_msgs/msg/LaserScan
  gz_type: gz.msgs.LaserScan
  direction: '['
- gz_topic: '{world}/model/{robot_name}/link/base_footprint/sensor/rear_laser/scan/points'
  ros_topic: scan/rear/points
  ros_type: sensor_msgs/msg/PointCloud2
  gz_type: gz.msgs.PointCloudPacked
  direction: '['
- gz_topic: /model/{robot_name}/pose
  ros_topic: pose
  ros_type: geometry_msgs/msg/PoseStamped
  gz_type: gz.msgs.Pose
  direction: '['
