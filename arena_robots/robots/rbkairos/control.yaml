controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rbkairos_velocity_controller:
      type: mecanum_drive_controller/MecanumDriveController

rbkairos_velocity_controller:
  ros__parameters:
    use_sim_time: true
    interface_name: velocity

    command_joint_names:
      - robot_front_left_wheel_joint
      - robot_back_left_wheel_joint
      - robot_back_right_wheel_joint
      - robot_front_right_wheel_joint
    front_left_wheel_command_joint_name: robot_front_left_wheel_joint
    front_right_wheel_command_joint_name: robot_front_right_wheel_joint
    rear_left_wheel_command_joint_name: robot_back_left_wheel_joint
    rear_right_wheel_command_joint_name: robot_back_right_wheel_joint

    kinematics.base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
    kinematics.wheels_radius: 0.127
    # half-wheelbase (0.21528) + half-track (0.2590), per rbkairos_base.urdf.xacro
    kinematics.sum_of_robot_center_projection_on_X_Y_axis: 0.47428

    publish_rate: 50.0
    reference_timeout: 0.5
    use_stamped_vel: false

    base_frame_id: robot_base_footprint
    odom_frame_id: odom
    enable_odom_tf: false

    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 1000000.0, 1000000.0, 0.03]

    cmd_vel_timeout: 0.5

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 1.5
    linear.x.min_velocity: -1.5
    linear.x.max_acceleration: 10.0
    linear.x.min_acceleration: -10.0

    linear.y.has_velocity_limits: true
    linear.y.has_acceleration_limits: true
    linear.y.max_velocity: 1.5
    linear.y.min_velocity: -1.5
    linear.y.max_acceleration: 10.0
    linear.y.min_acceleration: -10.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 4.0
    angular.z.min_velocity: -4.0
    angular.z.max_acceleration: 20.0
    angular.z.min_acceleration: -20.0
