arm:
  base_link: chassis_link
  tip_link: arm_tool0
  chain:
    - arm_shoulder_pan_joint
    - arm_shoulder_lift_joint
    - arm_elbow_joint
    - arm_wrist_1_joint
    - arm_wrist_2_joint
    - arm_wrist_3_joint
  controller: arm_controller
  moveit:
    package: ur_moveit_config
    planning_group: ur_manipulator
    srdf:
      package: arena_robots
      path: robots/ridgeback_plus/srdf/ridgeback_plus.srdf.xacro
    joint_limits:
      package: arena_robots
      path: robots/ridgeback_plus/srdf/joint_limits.yaml
    args:
      ur_type: ur5e
      safety_limits: true
  workspace:
    type: box
    frame: base_link
    min: [0.2, -0.5, 0.2]
    max: [0.7,  0.5, 1.0]
  named_poses:
    stow:
      joints:
        arm_shoulder_pan_joint: 0.0
        arm_shoulder_lift_joint: -1.57
        arm_elbow_joint: 1.57
        arm_wrist_1_joint: -1.57
        arm_wrist_2_joint: -1.57
        arm_wrist_3_joint: 0.0
    ready:
      joints:
        arm_shoulder_pan_joint: 0.0
        arm_shoulder_lift_joint: -1.0
        arm_elbow_joint: 1.0
        arm_wrist_1_joint: -1.5
        arm_wrist_2_joint: -1.57
        arm_wrist_3_joint: 0.0
    wave_up:
      joints:
        arm_shoulder_pan_joint: 0.0
        arm_shoulder_lift_joint: -0.5
        arm_elbow_joint: 1.2
        arm_wrist_1_joint: -2.3
        arm_wrist_2_joint: -1.57
        arm_wrist_3_joint: 0.0
    wave_l:
      joints:
        arm_shoulder_pan_joint: 0.0
        arm_shoulder_lift_joint: -0.5
        arm_elbow_joint: 1.2
        arm_wrist_1_joint: -2.3
        arm_wrist_2_joint: -1.57
        arm_wrist_3_joint: -0.6
    wave_r:
      joints:
        arm_shoulder_pan_joint: 0.0
        arm_shoulder_lift_joint: -0.5
        arm_elbow_joint: 1.2
        arm_wrist_1_joint: -2.3
        arm_wrist_2_joint: -1.57
        arm_wrist_3_joint: 0.6
