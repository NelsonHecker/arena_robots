robot_model: ridgeback_plus
base_frame: base_link
z_offset: 0.37
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/lidar
    frame: lidar
    sensor: gpu_lidar
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/lidar/points
    frame: lidar
    sensor: gpu_lidar
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: imu_sensor
    sensor: imu_0
control:
  mode: ros2_control
  config: package://arena_robots/robots/ridgeback_plus/control.yaml
  controllers:
    - joint_state_broadcaster
    - platform_velocity_controller
    - arm_controller
  cmd_vel_topic: platform_velocity_controller/cmd_vel
  odom_topic: platform_velocity_controller/odom
