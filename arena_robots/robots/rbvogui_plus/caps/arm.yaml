arm:
  base_link: robot_chassis_link
  tip_link: robot_arm_tool0
  chain:
    - robot_arm_shoulder_pan_joint
    - robot_arm_shoulder_lift_joint
    - robot_arm_elbow_joint
    - robot_arm_wrist_1_joint
    - robot_arm_wrist_2_joint
    - robot_arm_wrist_3_joint
  controller: arm_controller
  moveit:
    package: ur_moveit_config
    planning_group: ur_manipulator
    srdf:
      package: arena_robots
      path: robots/rbvogui_plus/srdf/rbvogui_plus.srdf.xacro
    joint_limits:
      package: arena_robots
      path: robots/rbvogui_plus/srdf/joint_limits.yaml
    args:
      ur_type: ur5e
      prefix: robot_
      safety_limits: true
  workspace:
    type: box
    frame: robot_chassis_link
    min: [0.2, -0.5, 0.2]
    max: [0.7, 0.5, 1.0]
  named_poses:
    stow:
      joints:
        robot_arm_shoulder_pan_joint: 0.0
        robot_arm_shoulder_lift_joint: -1.57
        robot_arm_elbow_joint: 1.57
        robot_arm_wrist_1_joint: -1.57
        robot_arm_wrist_2_joint: -1.57
        robot_arm_wrist_3_joint: 0.0
    ready:
      joints:
        robot_arm_shoulder_pan_joint: 0.0
        robot_arm_shoulder_lift_joint: -1.0
        robot_arm_elbow_joint: 1.0
        robot_arm_wrist_1_joint: -1.5
        robot_arm_wrist_2_joint: -1.57
        robot_arm_wrist_3_joint: 0.0
    wave_up:
      joints:
        robot_arm_shoulder_pan_joint: 0.0
        robot_arm_shoulder_lift_joint: -0.5
        robot_arm_elbow_joint: 1.2
        robot_arm_wrist_1_joint: -2.3
        robot_arm_wrist_2_joint: -1.57
        robot_arm_wrist_3_joint: 0.0
    wave_l:
      joints:
        robot_arm_shoulder_pan_joint: 0.0
        robot_arm_shoulder_lift_joint: -0.5
        robot_arm_elbow_joint: 1.2
        robot_arm_wrist_1_joint: -2.3
        robot_arm_wrist_2_joint: -1.57
        robot_arm_wrist_3_joint: -0.6
    wave_r:
      joints:
        robot_arm_shoulder_pan_joint: 0.0
        robot_arm_shoulder_lift_joint: -0.5
        robot_arm_elbow_joint: 1.2
        robot_arm_wrist_1_joint: -2.3
        robot_arm_wrist_2_joint: -1.57
        robot_arm_wrist_3_joint: 0.6
