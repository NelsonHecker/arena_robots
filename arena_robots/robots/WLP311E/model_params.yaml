robot_model: WLP311E
base_frame: base
z_offset: 0.29
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/lidar
    frame: lidar
    sensor: gpu_lidar
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/lidar/points
    frame: lidar
    sensor: gpu_lidar
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: imu_sensor
    sensor: imu_sensor
