robot_model: rbsummit
base_frame: robot_base_footprint
z_offset: 0.37
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/lidar
    frame: robot_front_laser_link
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/lidar/points
    frame: robot_front_laser_link
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: imu_sensor
  - name: rgbd_camera_image
    type: image
    topic: ${namespace}/rgbd_camera/image
    frame: front_camera_color
  - name: rgbd_camera_info
    type: camera_info
    topic: ${namespace}/rgbd_camera/camera_info
    frame: front_camera_color
control:
  mode: ros2_control
  config: package://arena_robots/robots/rbsummit/control.yaml
  controllers:
    - joint_state_broadcaster
    - rbsummit_velocity_controller
  cmd_vel_topic: rbsummit_velocity_controller/cmd_vel
