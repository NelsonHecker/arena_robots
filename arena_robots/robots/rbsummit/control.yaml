controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rbsummit_velocity_controller:
      type: diff_drive_controller/DiffDriveController

rbsummit_velocity_controller:
  ros__parameters:
    use_sim_time: true

    left_wheel_names: [ "robot_front_left_wheel_joint", "robot_back_left_wheel_joint" ]
    right_wheel_names: [ "robot_front_right_wheel_joint", "robot_back_right_wheel_joint" ]

    wheel_separation: 0.47
    wheel_radius: 0.1125

    # 4-wheel skid steer scrubs during rotation, so the effective lever arm is
    # wider than the physical track; 1.5 is empirical (same as husky).
    wheel_separation_multiplier: 1.5

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: robot_base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.03, 1000000.0, 1000000.0, 0.03]

    open_loop: false
    enable_odom_tf: false

    cmd_vel_timeout: 0.25
    use_stamped_vel: true

    publish_cmd: true
    publish_wheel_data: true

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 1.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 1.0
    angular.z.max_acceleration: 1.0
