controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    turtlebot_velocity_controller:
      type: diff_drive_controller/DiffDriveController

turtlebot_velocity_controller:
  ros__parameters:
    use_sim_time: true

    left_wheel_names: [ "left_wheel_joint" ]
    right_wheel_names: [ "right_wheel_joint" ]

    wheel_separation: 0.24
    wheels_per_side: 1
    wheel_radius: 0.098

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal : [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.03, 1000000.0, 1000000.0, 0.03]

    open_loop: false
    enable_odom_tf: false

    cmd_vel_timeout: 0.25
    use_stamped_vel: true

    publish_cmd: true
    publish_wheel_data: true

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: false
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 0.4
    linear.x.min_velocity: -0.4

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: false
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 1.9
    angular.z.min_velocity: -1.9
