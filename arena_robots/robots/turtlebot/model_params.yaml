robot_model: turtlebot
base_frame: base_link
z_offset: 0.04
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/lidar
    frame: rplidar_link
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/lidar/points
    frame: rplidar_link
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: imu_sensor
  - name: bumper_contact
    type: contact
    topic: ${namespace}/bumper/contact
    frame: bumper_contact_sensor
  - name: rgbd_camera_info
    type: camera_info
    topic: ${namespace}/rgbd_camera/camera_info
    frame: rgbd_camera
  - name: rgbd_camera_depth
    type: depth
    topic: ${namespace}/rgbd_camera/depth_image
    frame: rgbd_camera
  - name: rgbd_camera_image
    type: image
    topic: ${namespace}/rgbd_camera/image
    frame: rgbd_camera
  - name: rgbd_camera_points
    type: pointcloud
    topic: ${namespace}/rgbd_camera/points
    frame: rgbd_camera
control:
  mode: ros2_control
  config: package://arena_robots/robots/turtlebot/control.yaml
  controllers:
    - joint_state_broadcaster
    - turtlebot_velocity_controller
  cmd_vel_topic: turtlebot_velocity_controller/cmd_vel
