# Robot-Specific Acoustic Profile for turtlebot
# Derived from Method-A Datasheet Prior / Empirical Measurement
L_base_0: 45.0 # dBA stationary baseline at 1m
beta_0: 48.0 # dBA drivetrain intercept
beta_1: 18.0 # dB/decade speed scaling slope
beta_2: 5.0 # dB/decade load effort slope
beta_3: 3.0 # dB/decade control transient slope
beta_scrub_0: 40.0 # dBA scrub intercept
beta_scrub_1: 12.0 # dB/decade scrub speed slope
omega_ref: 5.0 # rad/s reference wheel speed
tau_ref: 15.0 # N*m reference joint effort
omega_deadband: 0.05 # rad/s
omega_active: 0.2 # rad/s
sigma_base: 2.0 # dBA baseline uncertainty
sigma_dynamic: 2.0 # dBA dynamic max speed uncertainty
sigma_no_effort: 4.0 # dBA penalty if effort topic is unmapped
