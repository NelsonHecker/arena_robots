- gz_topic: '{world}/model/{robot_name}/link/bumper/sensor/bumper_contact_sensor/contact'
  ros_topic: bumper/contact
  ros_type: visualization_msgs/msg/Marker
  gz_type: gz.msgs.Contacts
  direction: '['
- gz_topic: /model/{robot_name}/pose
  ros_topic: pose
  ros_type: geometry_msgs/msg/PoseStamped
  gz_type: gz.msgs.Pose
  direction: '['
