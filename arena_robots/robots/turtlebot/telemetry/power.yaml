robot_model: "turtlebot"

power_system:
  system_voltage_v: 24.0
  global_drivetrain_efficiency: 0.70
  heating_coefficient_ch: 1.25
  battery_capacity_wh: 270.0
  drivetrain_damping: 0.001
  drivetrain_friction: 0.02
  rolling_resistance_crr: 0.015
  robot_mass_kg: 3.5
  wheel_radius_m: 0.033
  num_wheels: 2

joint_metrics:
  topic: "joint_states"

static_power_w:
  compute_core: 30.0
  idle_motors: 5.0
