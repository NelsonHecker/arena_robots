robot_model: rskomnidirectional
base_frame: base
z_offset: 0.37
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/lidar
    frame: lidar
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/lidar/points
    frame: lidar
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: imu_sensor
control:
  mode: ros2_control
  config: package://arena_robots/robots/rskomnidirectional/control.yaml
  controllers:
    - joint_state_broadcaster
    - rskomni_velocity_controller
  cmd_vel_topic: rskomni_velocity_controller/cmd_vel
