# Energy Evaluation Configuration

robot_model: "go1"

power_system:
  system_voltage_v: 22.2              # 6S LiPo nominal voltage (22.2V)
  global_drivetrain_efficiency: 0.85  # Quasi-direct-drive (QDD) single-stage planetary gear
  heating_coefficient_ch: 0.25        # W/(N*m)^2 based on M107 motor R=0.22 Ohm, K_T=0.95 Nm/A
  battery_capacity_wh: 133.2          # 22.2V * 6.0 Ah standard pack (133.2 Wh)
  drivetrain_damping: 0.050           # Joint viscous damping in N*m*s/rad
  drivetrain_friction: 0.100          # Planetary gearbox Coulomb friction in N*m
  rolling_resistance_crr: 0.000       # Legged robot (no rolling resistance)
  robot_mass_kg: 12.0                 # Go1 Air/Pro mass in kg
  wheel_radius_m: 0.000               # Legged robot (no wheels)
  num_wheels: 0                       # 12 articulated leg actuators

joint_metrics:
  topic: "joint_states"

static_power_w:
  compute_core: 18.0                  # Main onboard compute (Raspberry Pi 4 / Jetson + companion MCUs)
  idle_motors: 6.0                    # Standby logic power for 12 motor inverter drivers (0.5W each)
