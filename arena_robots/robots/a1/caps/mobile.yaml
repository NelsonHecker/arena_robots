odom_frame: odom
sensor_frame: lidar
radius: 0.30
is_holonomic: true

footprint: [[0.16, 0.11], [0.16, -0.11], [-0.16, -0.11], [-0.16, 0.11]]
footprint_padding: 0.19

polygons_dict:
  StopPolygon:
    type: polygon
    points: [[0.16, 0.11], [0.16, -0.11], [-0.16, -0.11], [-0.16, 0.11]]
    action_type: stop
    min_points: 4
    visualize: true
    polygon_pub_topic: polygon_stop
    enabled: true

velocity_limits:
  linear: [-0.5, 0.5]
  angular: [-1.0, 1.0]

acceleration_limits:
  linear: 2.0
  angular: 3.0

actions:
  continuous:
    linear:
      min: -0.5
      max: 0.5
    angular:
      min: -1.0
      max: 1.0
  discrete:
    - angular: 0.0
      linear: 0.3
      name: move_forward
    - angular: 0.0
      linear: -0.15
      name: move_backward
    - angular: 0.35
      linear: 0.15
      name: turn_left
    - angular: -0.35
      linear: 0.15
      name: turn_right
    - angular: 0.75
      linear: 0.0
      name: turn_strong_left
    - angular: -0.75
      linear: 0.0
      name: turn_strong_right
    - angular: 0.0
      linear: 0.0
      name: stop

laser:
  angle:
    increment: 0.00654497222
    max: 2.35619
    min: -2.35619
  num_beams: 720
  range: 30.0
  update_rate: 10

nav2:
  planner_plugins:
    - GridBased
  planner_plugins_dict:
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
  global_observation:
    include: [lidar_points]
    min_obstacle_height: 0.2
    obstacle_max_range: 5.0
    raytrace_max_range: 12.0
