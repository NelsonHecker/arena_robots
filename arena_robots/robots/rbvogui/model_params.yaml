robot_model: rbvogui
base_frame: robot_base_footprint
z_offset: 0.37
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/scan
    frame: base_laser_link
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/scan/points
    frame: base_laser_link
  - name: lidar_rear
    type: laserscan
    topic: ${namespace}/scan/rear
    frame: rear_laser
  - name: lidar_rear_points
    type: pointcloud
    topic: ${namespace}/scan/rear/points
    frame: rear_laser
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: imu_sensor
  - name: front_rgbd_camera_image
    type: image
    topic: ${namespace}/front_rgbd_camera/color/image_raw
    frame: front_camera_color
  - name: front_rgbd_camera_info
    type: camera_info
    topic: ${namespace}/front_rgbd_camera/color/camera_info
    frame: front_camera_color
  - name: rear_rgbd_camera_image
    type: image
    topic: ${namespace}/rear_rgbd_camera/color/image_raw
    frame: rear_camera_color
  - name: rear_rgbd_camera_info
    type: camera_info
    topic: ${namespace}/rear_rgbd_camera/color/camera_info
    frame: rear_camera_color
control:
  mode: ros2_control
  config: package://arena_robots/robots/rbvogui/control.yaml
  controllers:
    - joint_state_broadcaster
    - robotnik_base_controller
  cmd_vel_topic: robotnik_base_controller/cmd_vel
