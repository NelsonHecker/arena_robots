robot_model: boxer
base_frame: base_link
z_offset: 0.0635
sensors:
  - name: front_laser
    type: laserscan
    topic: ${namespace}/front_laser
    frame: lidar
  - name: front_laser_points
    type: pointcloud
    topic: ${namespace}/front_laser/points
    frame: lidar
  - name: rear_laser
    type: laserscan
    topic: ${namespace}/rear_laser
    frame: lidar
  - name: rear_laser_points
    type: pointcloud
    topic: ${namespace}/rear_laser/points
    frame: lidar
  - name: imu
    type: imu
    topic: ${namespace}/imu/data
    frame: imu_sensor
  - name: rgbd_camera_info
    type: camera_info
    topic: ${namespace}/rgbd_camera/camera_info
    frame: realsense_front_camera
  - name: rgbd_camera_depth
    type: depth
    topic: ${namespace}/rgbd_camera/depth_image
    frame: realsense_front_camera
  - name: rgbd_camera_points
    type: pointcloud
    topic: ${namespace}/rgbd_camera/points
    frame: realsense_front_camera
control:
  mode: ros2_control
  config: package://arena_robots/robots/boxer/control.yaml
  controllers:
    - joint_state_broadcaster
    - boxer_velocity_controller
  cmd_vel_topic: boxer_velocity_controller/cmd_vel
