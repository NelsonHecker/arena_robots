# imu frame override "imu_sensor_link" (not imu_link) avoids clashing with boxer's own
# imu_link, used by an untouched dead Gazebo-Classic IMU block.
prefix: ""
mounts:
  front_laser:
    parent: chassis_link
    xyz: [0.3062, 0.0, 0.1614]
    rpy: [0, 0, 0]
    accepts: [lidar]
  rear_sensor:
    parent: chassis_link
    xyz: [-0.3404, 0.0241, 0.0779]
    rpy: [0, -0.0698131700798, 3.141592653589793]
    accepts: [lidar]
  imu:
    parent: base_link
    xyz: [0, 0, 0]
    rpy: [0, 0, 0]
    accepts: [imu]
priority:
  lidar: [front_laser, rear_sensor]
  imu: [imu]
defaults:
  lidar:
    - variant: boxer_front
      mount: front_laser
    - variant: boxer_rear
      mount: rear_sensor
  imu:
    - variant: arena_default
      mount: imu
      params: {frame: imu_sensor_link}
