# M4 Acoustic Profile for Jackal / Differential UGV (gearbox + motor noise only)
L_base_0: 42.0 # dBA stationary baseline at 1m
beta_0: 45.0 # dBA drivetrain intercept
beta_1: 18.0 # dB/decade speed scaling slope
beta_2: 5.0 # dB/decade load effort slope
beta_3: 3.0 # dB/decade control transient slope
omega_ref: 5.0 # rad/s reference wheel speed
tau_ref: 10.0 # N*m reference joint effort
omega_deadband: 0.05 # rad/s
omega_active: 0.20 # rad/s
sigma_base: 1.5 # dBA baseline uncertainty
sigma_dynamic: 2.0 # dBA dynamic max speed uncertainty
sigma_no_effort: 4.0 # dBA penalty if effort topic is unmapped
