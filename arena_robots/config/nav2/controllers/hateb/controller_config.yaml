goal_checker_plugin_class: "hateb_local_planner::HATEBGoalChecker"

controller_plugins:
 - FollowPath
controller_plugins_dict:
 FollowPath:
   plugin: "hateb_local_planner::HATebLocalPlannerROS"
   ns: ${namespace}
   odom_topic: ${odom_frame:-odom}
   # global_frame/map_frame/base_frame are overwritten at runtime from the nav2
   # costmap (getGlobalFrameID/getBaseFrameID), set to match to avoid a transient mismatch
   global_frame: ${frame:-}${odom_frame:-odom}
   map_frame: ${frame:-}${odom_frame:-odom}
   base_frame: ${frame:-}${base_frame:-base_link}
   footprint_frame: ${frame:-}${base_frame:-base_link}
   planning_mode: 1

   footprint_model:
     type: "circular"
     radius: 0.3
     line_start: [-0.3, 0.0]
     line_end: [0.3, 0.0]
     front_offset: 0.2
     front_radius: 0.2
     rear_offset: 0.2
     rear_radius: 0.2
     vertices: "[[-0.325, -0.325], [-0.325, 0.325], [0.325, 0.325], [0.46, 0.0], [0.325, -0.325]]"

   bt_mode_switch:
     bt_xml_path: "behavior_trees/all_modes_bt4.6.xml"
     agents_info_topic: "/agents_info"
     plan_sub_topic: "/plan"
     result_sub_topic: "/navigate_to_pose/_action/status"
     passage_sub_topic: "/invisible_humans_detection/passage"

   # robot kinematics
   robot:
     max_vel_x: ${max_linear_vel:-0.5}
     max_vel_x_backwards: ${max_linear_vel:-0.5}
     max_vel_y: ${max_lateral_vel:-0.0}
     max_vel_theta: ${max_angular_vel:-1.0}
     acc_lim_x: ${linear_acc:-0.5}
     acc_lim_y: ${lateral_acc:-0.5}
     acc_lim_theta: ${angular_acc:-0.5}
     min_turning_radius: 0.0
     wheelbase: 1.0
     cmd_angle_instead_rotvel: false
     is_footprint_dynamic: false
     use_simulated_fov: false

   # agent model
   agent:
     agent_radius: 0.3
     max_agent_vel_x: 1.3
     max_agent_vel_y: 0.4
     max_agent_vel_x_backwards: 0.01
     max_agent_vel_theta: 1.1
     agent_acc_lim_x: 0.6
     agent_acc_lim_y: 0.3
     agent_acc_lim_theta: 0.8
     agent_fov: 3.14
     num_moving_avg: 5

   # trajectory
   trajectory:
     teb_autosize: true
     dt_ref: 0.1
     dt_hysteresis: 0.01
     min_samples: 3
     max_samples: 500
     agent_min_samples: 3
     global_plan_overwrite_orientation: true
     allow_init_with_backwards_motion: false
     global_plan_viapoint_sep: 0.2
     via_points_ordered: false
     max_global_plan_lookahead_dist: 0.0
     global_plan_prune_distance: 1.0
     exact_arc_length: false
     force_reinit_new_goal_dist: 1.0
     force_reinit_new_goal_angular: 1.57
     feasibility_check_no_poses: 2
     publish_feedback: false
     min_resolution_collision_check_angular: 3.14
     control_look_ahead_poses: 1
     teb_init_skip_dist: 0.4
     visualize_with_time_as_z_axis_scale: 0.0

   # goal tolerance
   goal:
     xy_goal_tolerance: 0.2
     yaw_goal_tolerance: 0.1
     free_goal_vel: true
     complete_global_plan: true

   # obstacles
   obstacles:
     min_obstacle_dist: 0.2
     inflation_dist: 0.6
     use_nonlinear_obstacle_penalty: true
     obstacle_cost_mult: 1.0
     dynamic_obstacle_inflation_dist: 0.6
     include_dynamic_obstacles: true
     include_costmap_obstacles: true
     costmap_obstacles_behind_robot_dist: 0.5
     obstacle_poses_affected: 1
     legacy_obstacle_association: false
     obstacle_association_force_inclusion_factor: 1.5
     obstacle_association_cutoff_factor: 5.0
     costmap_converter_plugin: ""
     costmap_converter_spin_thread: true
     costmap_converter_rate: 10

   # optimization
   optim:
     no_inner_iterations: 8
     no_outer_iterations: 4
     optimization_activate: true
     optimization_verbose: false
     penalty_epsilon: 0.01
     time_penalty_epsilon: 0.1
     cap_optimaltime_penalty: true
     weight_max_vel_x: 2.0
     weight_max_vel_y: 2.0
     weight_max_vel_theta: 1.0
     weight_acc_lim_x: 1.0
     weight_acc_lim_y: 1.0
     weight_acc_lim_theta: 1.0
     weight_kinematics_nh: 1000.0
     weight_kinematics_forward_drive: 50.0
     weight_kinematics_turning_radius: 0.0
     weight_optimaltime: 1.0
     weight_shortest_path: 1.0
     weight_obstacle: 50.0
     weight_inflation: 0.1
     weight_dynamic_obstacle: 50.0
     weight_dynamic_obstacle_inflation: 0.1
     weight_viapoint: 0.05
     weight_prefer_rotdir: 50.0
     weight_adapt_factor: 2.0
     obstacle_cost_exponent: 1.0
     weight_max_agent_vel_x: 4.0
     weight_max_agent_vel_y: 4.0
     weight_nominal_agent_vel_x: 2.0
     weight_max_agent_vel_theta: 2.0
     weight_agent_acc_lim_x: 2.0
     weight_agent_acc_lim_y: 2.0
     weight_agent_acc_lim_theta: 2.0
     weight_agent_optimaltime: 3.0
     weight_agent_viapoint: 0.5
     weight_invisible_human: 1.0
     weight_agent_robot_safety: 5.0
     weight_agent_agent_safety: 2.0
     weight_agent_robot_rel_vel: 5.0
     weight_agent_robot_visibility: 5.0
     disable_warm_start: true
     disable_rapid_omega_chage: true
     omega_chage_time_seperation: 1.0

   # HATEB social constraints
   hateb:
     use_agent_robot_safety_c: true
     use_agent_agent_safety_c: true
     use_agent_robot_rel_vel_c: true
     add_invisible_humans: false
     use_agent_robot_visi_c: true
     use_agent_elastic_vel: true
     pose_prediction_reset_time: 2.0
     min_agent_robot_dist: 0.8
     min_agent_agent_dist: 0.4
     rel_vel_cost_threshold: 1.5
     invisible_human_threshold: 1.0
     visibility_cost_threshold: 2.5
     prediction_time_horizon: 10.0

   # recovery
   recovery:
     shrink_horizon_backup: true
     shrink_horizon_min_duration: 10.0
     oscillation_recovery: true
     oscillation_v_eps: 0.1
     oscillation_omega_eps: 0.1
     oscillation_recovery_min_duration: 10.0
     oscillation_filter_duration: 10.0

   # visualization
   visualization:
     publish_robot_global_plan: true
     publish_robot_local_plan: true
     publish_robot_local_plan_poses: false
     publish_robot_local_plan_fp_poses: false
     publish_agents_global_plans: false
     publish_agents_local_plans: true
     publish_agents_local_plan_poses: false
     publish_agents_local_plan_fp_poses: false
     pose_array_z_scale: 1.0
